syntax = "proto3";

package zitaotech.trackpoint;

// Requests ---------------------------------------------------------------

message GetStateRequest {
}

message SetDpiRequest {
  // Zero-based DPI step index (0 = slowest). The firmware clamps it.
  uint32 dpi_index = 1;
}

message SetBurstRequest {
  // Burst mode multiplies the pointer speed on top of the DPI step.
  bool enabled = 1;
  // x1 .. x10 (clamped by the firmware).
  uint32 multiplier = 2;
}

// Per-direction fine tuning.  Each field is a multiplier in hundredths
// (100 = x1.00, 150 = x1.50), because a TrackPoint is rarely equally sensitive
// in all four directions.
message SetAxisScalesRequest {
  uint32 x_positive = 1;
  uint32 x_negative = 2;
  uint32 y_positive = 3;
  uint32 y_negative = 4;
}

// Linear acceleration: while the pointer keeps moving the same way, the speed
// ramps up linearly towards this multiplier.  Hundredths (100 = x1.00 = off).
message SetAccelRequest {
  uint32 accel = 1;
}

// Scroll speed (percent of the driver's own scroll rate) and scroll burst,
// which multiplies that on top the way the pointer's burst mode does.
message SetScrollRequest {
  uint32 speed_percent = 1;
  bool burst_enabled = 2;
  uint32 burst_multiplier = 3;
  // Scroll acceleration ceiling, in hundredths (100 = x1.00 = off).
  uint32 accel = 4;
}

// Keymap position that puts the TrackPoint into scroll mode while held, or -1
// for "unassigned".  The key may live on either half: the central relays its
// state to the peripheral, which is where the TrackPoint actually is.
message SetScrollKeyRequest {
  int32 position = 1;
}

// Scroll switches: Caps Lock as a scroll key, and per-axis direction flips.
message SetScrollOptionsRequest {
  bool capslock_scroll = 1;
  bool invert_x = 2;
  bool invert_y = 3;
}

// One assignable mode key.  `mode` is 0 = arrow, 1 = fast, 2 = slow, 3 = scroll.
message SetModeKeyRequest {
  uint32 mode = 1;
  int32 position = 2;
}

message SetArrowThresholdRequest {
  uint32 threshold = 1;
}

message SetSmoothScrollRequest {
  bool enabled = 1;
}

message ResetRequest {
}

message Request {
  oneof request_type {
    GetStateRequest get_state = 1;
    SetDpiRequest set_dpi = 2;
    SetBurstRequest set_burst = 3;
    ResetRequest reset = 4;
    SetAxisScalesRequest set_axis_scales = 5;
    SetAccelRequest set_accel = 6;
    SetScrollRequest set_scroll = 7;
    SetScrollKeyRequest set_scroll_key = 8;
    SetScrollOptionsRequest set_scroll_options = 9;
    SetModeKeyRequest set_mode_key = 10;
    SetArrowThresholdRequest set_arrow_threshold = 11;
    SetSmoothScrollRequest set_smooth_scroll = 12;
  }
}

// Responses --------------------------------------------------------------

message State {
  bool supported = 1;
  string driver_name = 2;
  uint32 dpi_index = 3;
  uint32 dpi_value = 4;
  uint32 dpi_min = 5;
  uint32 dpi_max = 6;
  uint32 dpi_step = 7;
  uint32 dpi_levels = 8;
  bool burst_enabled = 9;
  uint32 burst_multiplier = 10;
  uint32 burst_multiplier_max = 11;
  uint32 axis_x_positive = 12;
  uint32 axis_x_negative = 13;
  uint32 axis_y_positive = 14;
  uint32 axis_y_negative = 15;
  uint32 axis_scale_min = 16;
  uint32 axis_scale_max = 17;
  uint32 accel = 18;
  uint32 accel_min = 19;
  uint32 accel_max = 20;
  uint32 scroll_speed_percent = 21;
  uint32 scroll_speed_min = 22;
  uint32 scroll_speed_max = 23;
  bool scroll_burst_enabled = 24;
  uint32 scroll_burst_multiplier = 25;
  uint32 scroll_burst_multiplier_max = 26;
  uint32 scroll_accel = 27;
  uint32 scroll_accel_min = 28;
  uint32 scroll_accel_max = 29;
  int32 scroll_key = 30;
  bool scroll_capslock_enabled = 31;
  bool scroll_invert_x = 32;
  bool scroll_invert_y = 33;
  int32 arrow_key = 34;
  int32 fast_key = 35;
  int32 slow_key = 36;
  uint32 arrow_swipe_threshold = 37;
  uint32 arrow_swipe_min = 38;
  uint32 arrow_swipe_max = 39;
  bool smooth_scroll_enabled = 40;
  bool smooth_scroll_supported = 41;
}

message Ok {
}

message Error {
  string message = 1;
}

message Response {
  oneof response_type {
    State state = 1;
    Ok ok = 2;
    Error error = 3;
  }
}

// Pushed by the keyboard whenever a setting changes on the device itself
// (e.g. the &DPI keys), so the web UI updates without polling.
message Notification {
  State state = 1;
}
