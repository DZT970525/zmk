# I2C Trackpad
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LOG=y



# Keep mainline's smooth scrolling machinery on: input_listener.c now asks the
# ZitaoTech trackpad module's runtime flag before applying it, so Studio's
# switch really turns smooth scrolling on and off (same wiring as Q10/Q20).
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Sofle has status LEDs, but no keyboard backlight or RGB strip.
CONFIG_ZMK_BACKLIGHT=n
CONFIG_ZMK_RGB_UNDERGLOW=n

CONFIG_ZMK_KEYBOARD_NAME="ZitaoTech_SOFLE"

# Release version reported to Studio.
CONFIG_ZMK_DEVICE_INFO_VERSION="V1.01"
