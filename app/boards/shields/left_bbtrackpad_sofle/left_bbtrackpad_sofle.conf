# I2C Trackpad
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LOG=y



# Keep mainline's smooth scrolling machinery on: input_listener.c now asks the
# ZitaoTech trackpad module's runtime flag before applying it, so Studio's
# switch really turns smooth scrolling on and off (same wiring as Q10/Q20).
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
