CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=n
CONFIG_NICE_VIEW_WIDGET_STATUS=y
CONFIG_LPM009M360A=y
# LVGL 9 builds and draws the first status screen from the boot (main) thread,
# and its draw path needs a lot more stack than LVGL 8 did.  With the 2 KB main
# stack the board died right after USB came up, as soon as the screen was built.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
# LVGL renders lines / arcs / transformed images through scratch buffers taken
# from this pool; a failed allocation hits LV_ASSERT_MALLOC (an infinite loop,
# i.e. the board freezes).  4 KB is not enough for the arc drawing (the BLE
# slot highlight), 6 KB is the smallest value that works so far.
CONFIG_LV_Z_MEM_POOL_SIZE=6144
# The battery percentage line needs the battery status widget itself.
# NOTE: the shield ships its own battery listener (widgets/status.c on the
# central half, widgets/peripheral_status.c on the peripheral half), which
# defines the same symbols as app/src/display/widgets/battery_status.c.
# Enabling the upstream widget therefore breaks the link with a duplicate
# symbol error, so it must stay off.
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
# The panel is driven in 8 color mode, the status screen is drawn light on dark
CONFIG_NICE_VIEW_WIDGET_INVERTED=y
# Disable idle blanking
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Dedicated image GATT traffic; Studio USB RX capacity stays unchanged.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
