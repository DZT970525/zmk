# Temporary diagnostic build: turn on USB logging so the firmware reports why
# the keyboard backlight (GP25) does or does not light up.
#
#   west build -p always -b hackberrypiq20/rp2040/zmk -s app -d build-hbq20-debug \
#       -- -DEXTRA_CONF_FILE=boards/zitaotech/hackberrypiq20/debug-usb-logging.conf
#
# Then open the CDC ACM port (115200) and watch the boot log:
#   * "Backlight device ... is not ready"  -> the pwm-leds device failed to init
#   * "Failed to update backlight LED 0: -..." -> the LED/PWM call errored
#   * only "Update backlight brightness: 100%" and still dark -> the LED circuit
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
