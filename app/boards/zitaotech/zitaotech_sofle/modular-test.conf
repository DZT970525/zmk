CONFIG_SOFLE_MODULAR_POINTING=y
CONFIG_ZITAOTECH_TRACKPAD_SCROLL_KEY_POSITION=61
CONFIG_ZITAOTECH_TRACKPAD_ARROW_KEY_POSITION=-1
CONFIG_ZITAOTECH_TRACKPOINT_SCROLL_KEY_POSITION=61
CONFIG_ZITAOTECH_TRACKPAD_DRIVER_NAME="Left_hand_Touchpad"
CONFIG_ZITAOTECH_TRACKPOINT_DRIVER_NAME="Right_hand_TrackPoint"
CONFIG_ZMK_DEVICE_INFO_VERSION="V1.27"



# Runtime combo capacity, reported to Studio; existing slots are preserved.
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=16

# Compact release: omit debug logging without removing keyboard features.
CONFIG_LOG=n
