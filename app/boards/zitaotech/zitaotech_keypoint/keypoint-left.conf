CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=8
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=20
CONFIG_ZITAOTECH_TRACKPAD_DPI_MIN=1
CONFIG_ZITAOTECH_TRACKPAD_DPI_STEP=1
CONFIG_ZITAOTECH_TRACKPOINT_DPI_MIN=1
CONFIG_ZITAOTECH_TRACKPOINT_DPI_STEP=1
CONFIG_ZITAOTECH_TRACKPOINT_SCROLL_ACCEL_MAX=500
CONFIG_ZITAOTECH_TRACKPOINT_SCROLL_KEY_POSITION=49
CONFIG_ZITAOTECH_TRACKPAD_ARROW_KEY_POSITION=49
CONFIG_ZITAOTECH_TRACKPAD_SCROLL_KEY_POSITION=0
CONFIG_ZMK_KEYBOARD_NAME="KEYPOINT"
CONFIG_ZITAOTECH_TRACKPAD_CONTROL=y


CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_ZITAOTECH_TRACKPAD_MOUSE_LAYER_CONTROL=y
CONFIG_ZMK_INPUT_PROCESSOR_TEMP_LAYER=y

# Let BLE/input run before screen drawing.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10

# Left display: quarter-screen partial flush buffer (5184 bytes RGB565).
CONFIG_LV_Z_VDB_SIZE=25

# BLE RX (8) / TX (7) must run before sustained pointer input.
CONFIG_INPUT_THREAD_PRIORITY=9
CONFIG_ZMK_BLE_THREAD_PRIORITY=9

CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
CONFIG_BT_MAX_PAIRED=8
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_INPUT_PROCESSOR_TEMP_LAYER=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_MACRO_COUNT=32
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=4096
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZITAOTECH_TRACKPOINT_CONTROL_STUDIO_RPC=y
CONFIG_ZITAOTECH_TRACKPAD_CONTROL_STUDIO_RPC=y
CONFIG_ZITAOTECH_BOOTMAGIC_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUES=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
CONFIG_ZMK_CUSTOM_SETTINGS_ARRAY=y

CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y



CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0

CONFIG_ZITAOTECH_TRACKPAD_MOUSE_LAYER_CONTROL=y
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# Match the split keyboard scan and central event queues to the validated trial.
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=64
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=64
CONFIG_UART_LINE_CTRL=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256

CONFIG_ZMK_RUNTIME_TAP_DANCE=y
CONFIG_ZMK_RUNTIME_TAP_DANCE_COUNT=16
CONFIG_ZMK_RUNTIME_TAP_DANCE_STUDIO_RPC=y
CONFIG_ZMK_MATRIX_TESTER=y

# Request shortest supported host BLE interval; USB HID remains 1 ms.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_ZMK_KEYBOARD_NAME="KEYPOINT"
CONFIG_ZMK_DEVICE_INFO_VERSION="V1.06"
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=8


CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Ten left area pictures plus runtime configuration use existing128KB settings.
CONFIG_SETTINGS_NVS_SECTOR_COUNT=32

# Five int32 mode keys include -1 sentinels (10 bytes each on the wire).
# Keep custom decoding capacity separate from the transport burst buffer.
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=128

# Bound stalled I2C transfers during module probing and normal operation.
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=100

# 512 allocation-table addresses (2048 bytes): large imported keymaps were measured
# to boot faster than with 128 entries. No settings format or data changes.
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_NVS_LOOKUP_CACHE_SIZE=512
